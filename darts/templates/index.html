<!doctype html>
<html lang="da">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HA Darts</title>
<style>
:root{color-scheme:dark; font:16px system-ui; background:#101716;color:#e9f4ed}
body{max-width:1080px;margin:32px auto;padding:0 18px}
h1{font-size:2rem}.views{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}
figure{margin:0}figcaption{margin-bottom:6px}img{display:block;width:100%;aspect-ratio:4/3;background:#1c2925;border-radius:8px}
button{font:inherit;padding:9px 14px;border:1px solid #5ea984;border-radius:6px;background:#203c31;color:inherit;margin:0 4px 7px 0}
button:disabled{opacity:.5}output{display:block;min-height:2rem}strong{font-size:1.4rem}
dialog{max-width:min(480px,90vw);border:1px solid #5ea984;border-radius:8px;background:#182522;color:inherit}
dialog::backdrop{background:#0009}
canvas{display:block;width:100%;height:auto;cursor:crosshair;margin-bottom:14px}
.camera-frame{position:relative}
.camera-frame canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;margin:0}
#dartboard{cursor:default;background:#101716;margin:0}
.camera-frame canvas.editable{pointer-events:auto;touch-action:none;cursor:grab}
#crop{touch-action:none}
</style>
<h1>HA Darts</h1>
<p><strong id="score">0 point</strong> <span id="throws"></span></p>
<div>
<button id="reset">Start tur med tom skive</button>
<button id="autoCalibrate">1-touch kalibrering</button>
<button id="calibrate">Detaljeret kalibrering</button>
<button id="refresh">Hent billeder</button>
</div>
<p>MQTT: <span id="mqtt">Henter status</span></p>
<div id="review" hidden>
<span>Træk direkte i en blå ring for at flytte den. Klik på ringen for at zoome.</span>
<button id="saveCalibration">Gem kalibrering</button>
<label for="editPoint">Ret punkt</label> <select id="editPoint"></select>
<button id="redoPoint">Markér igen</button>
</div>
<output id="status" aria-live="polite"></output>
<div class="views">
<figure><figcaption>Venstre kamera</figcaption><div class="camera-frame"><img id="left" alt="Venstre kamerabillede"><canvas id="leftOverlay" hidden></canvas></div></figure>
<figure><figcaption>Højre kamera</figcaption><div class="camera-frame"><img id="right" alt="Højre kamerabillede"><canvas id="rightOverlay" hidden></canvas></div></figure>
{% if third_camera %}
<figure><figcaption>Center Cam · gult kryds: fundet spids · blå ring: beregnet træf</figcaption><div class="camera-frame"><img id="third" alt="RTSP-kamerabillede"><canvas id="thirdOverlay" hidden></canvas></div></figure>
{% endif %}
<figure>
  <figcaption>Dartskive · træfpunkter</figcaption>
  <canvas id="dartboard" width="400" height="400" role="img" aria-label="Dartskive uden registrerede pile"></canvas>
</figure>
</div>
<dialog id="zoom">
<h2 id="zoomTitle"></h2>
<p>Sæt X midt i det angivne wirekryds eller i bullens centrum.</p>
<canvas id="crop" width="420" height="420" aria-label="Forstørret kamerabillede"></canvas>
<button id="confirm" disabled>Bekræft punkt</button>
<button id="cancelZoom">Vælg udsnit igen</button>
</dialog>
<script>
const get = id => document.getElementById(id);
const sides = ["left", "right"];
if (get("third")) sides.push("third");
const cameraNames = {left: "Venstre kamera", right: "Højre kamera", third: "Center Cam"};
const completed = () => points && sides.every(side => points[side].length === labels.length);
const stepIndex = () => Math.min(...sides.map(side => points[side].length));
const board = {{ board | tojson }};
const wires = ["5/20", "13/6", "17/3", "8/11"];
const standardLabels = [
  ...wires.map(wire => "Inderste dobbeltwire " + wire),
  ...wires.map(wire => "Yderste tripelwire " + wire),
  "Midten af bull"
];
const ringNames = ["Indre bullkant", "Ydre bullkant", "Inderste tripelwire",
  "Yderste tripelwire", "Inderste dobbeltwire", "Yderste dobbeltwire"];
const detailedLabels = ["Midten af bull", ...ringNames.flatMap((ring, index) =>
  board.sectors.map((number, sector) => {
    const previous = (sector + board.sectors.length - 1) % board.sectors.length;
    const boundary = board.sectors[previous] + "/" + number;
    return ring + " ved sektorgrænsen " + boundary +
      (index < 2 ? " (forlæng wirelinjen mod centrum)" : "");
  }))];
let labels = standardLabels;
function setLabels(next) {
  labels = next;
  get("editPoint").replaceChildren(...labels.map((label, index) => new Option(label, index)));
}
let editing = null;
let points = null, busy = false;
let zoom = null;
let overlayReady = false;
let previewData = null;
let drag = null;
const cropSize = 120;
const canvas = get("crop");
const context = canvas.getContext("2d");
function controls() {
  get("reset").disabled = busy || !!points;
  const reviewing = editing === null && completed();
  get("review").hidden = !reviewing;
  get("saveCalibration").disabled = busy || !overlayReady;
  get("redoPoint").disabled = busy;
  get("refresh").disabled = busy || !!points;
  get("calibrate").disabled = busy;
  get("autoCalibrate").disabled = busy || !!points;
  get("calibrate").textContent = points ? "Afbryd kalibrering" : "Detaljeret kalibrering";
}
async function refresh() {
  await Promise.all(sides.map(side => new Promise((resolve, reject) => {
    const img = get(side);
    img.onload = resolve;
    img.onerror = () => reject(Error("Kunne ikke hente billedet fra " + side));
    img.src = "image/" + side + "?t=" + Date.now();
  })));
}
async function run(task) {
  busy = true;
  controls();
  try { await task(); }
  catch (err) { get("status").textContent = err.message; }
  finally { busy = false; controls(); }
}
async function action(name, payload) {
  const response = await fetch("action/" + name, {
    method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload ?? {})
  });
  const data = await response.json();
  if (!response.ok) throw Error(data.error);
  drawTurn(data);
}
function drawBoard(darts) {
  const view = get("dartboard");
  const pen = view.getContext("2d");
  const center = view.width / 2;
  const wedge = 2 * Math.PI / board.sectors.length;

  function ring(outer, inner, start, end, color) {
    pen.beginPath();
    pen.arc(0, 0, outer, start, end);
    if (inner > 0) pen.arc(0, 0, inner, end, start, true);
    else pen.lineTo(0, 0);
    pen.closePath();
    pen.fillStyle = color;
    pen.fill();
    pen.strokeStyle = "#808080";
    pen.lineWidth = .7;
    pen.stroke();
  }

  pen.clearRect(0, 0, view.width, view.height);
  pen.save();
  pen.translate(center, center);
  pen.scale(.84, .84);
  ring(228, 0, 0, 2 * Math.PI, "#181818");
  for (const [index, number] of board.sectors.entries()) {
    const angle = index * wedge - Math.PI / 2;
    const start = angle - wedge / 2;
    const end = angle + wedge / 2;
    const single = index % 2 ? "#dec89d" : "#242424";
    const multiplier = index % 2 ? "#178054" : "#b73338";
    ring(board.treble_inner, board.bull_outer, start, end, single);
    ring(board.treble_outer, board.treble_inner, start, end, multiplier);
    ring(board.double_inner, board.treble_outer, start, end, single);
    ring(board.double_outer, board.double_inner, start, end, multiplier);
    pen.font = "bold 15px system-ui";
    pen.textAlign = "center";
    pen.textBaseline = "middle";
    pen.fillStyle = "#fff";
    const labelRadius = board.double_outer + 14;
    pen.fillText(number, labelRadius * Math.cos(angle), labelRadius * Math.sin(angle));
  }
  ring(board.bull_outer, 0, 0, 2 * Math.PI, "#178054");
  ring(board.bull_inner, 0, 0, 2 * Math.PI, "#b73338");

  for (const [index, dart] of darts.entries()) {
    const {x_mm: x, y_mm: y} = dart;
    if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
    pen.beginPath();
    pen.arc(x, y, 7, 0, 2 * Math.PI);
    pen.fillStyle = "#50e6ff";
    pen.fill();
    pen.strokeStyle = "#101716";
    pen.lineWidth = 1.5;
    pen.stroke();
    pen.font = "bold 10px system-ui";
    pen.fillStyle = "#101716";
    pen.fillText(index + 1, x, y);
  }
  pen.restore();
  view.setAttribute("aria-label", darts.length
    ? darts.map((dart, index) => "Pil " + (index + 1) + " " + dart.field).join(", ")
    : "Dartskive uden registrerede pile");
}
function drawCameraHits(data) {
  if (points) return;
  for (const side of sides) {
    const img = get(side);
    const layer = get(side + "Overlay");
    const hits = data.camera_hits?.[side] ?? [];
    layer.hidden = !hits.length || !img.naturalWidth;
    if (layer.hidden) continue;
    layer.width = img.naturalWidth;
    layer.height = img.naturalHeight;
    const pen = layer.getContext("2d");
    const scale = layer.width / Math.max(1, img.clientWidth);
    pen.font = "bold " + 12 * scale + "px system-ui";
    pen.lineWidth = 2 * scale;
    for (const [index, hit] of hits.entries()) {
      if (hit.initial) {
        const [x, y] = hit.initial;
        pen.strokeStyle = "#ffdc53";
        pen.beginPath();
        pen.moveTo(x - 6 * scale, y);
        pen.lineTo(x + 6 * scale, y);
        pen.moveTo(x, y - 6 * scale);
        pen.lineTo(x, y + 6 * scale);
        pen.stroke();
      }
      const [x, y] = hit.final;
      pen.strokeStyle = pen.fillStyle = "#50e6ff";
      pen.beginPath();
      pen.arc(x, y, 8 * scale, 0, 2 * Math.PI);
      pen.stroke();
      pen.fillText(index + 1, x + 10 * scale, y);
    }
  }
}
function drawTurn(data) {
  drawBoard(data.darts);
  drawCameraHits(data);
  get("score").textContent = data.total + " point";
  get("throws").textContent = data.darts.map(d => {
    if (d.validation === "disagrees") return d.field + " (Center Cam: " + d.center_field + ")";
    return d.field;
  }).join(" · ");
  get("status").textContent = data.status;
  get("mqtt").textContent = data.mqtt;
}
async function poll() {
  try {
    if (!busy && !points) {
      const response = await fetch("state", {cache: "no-store"});
      if (!response.ok) return;
      const data = await response.json();
      if (busy || points) return;
      drawTurn(data);
      await run(refresh);
    }
  } catch (err) {
    if (!busy && !points) get("status").textContent = "Kunne ikke hente kaststatus.";
  } finally {
    setTimeout(poll, 1200);
  }
}

function prompt() {
  const step = editing?.index ?? stepIndex();
  get("status").textContent = (step + 1) + "/" + labels.length + ": " +
    labels[step] + ". Markér punktet i alle kamerabilleder.";
}
get("reset").onclick = () => run(() => action("reset"));
get("refresh").onclick = () => run(refresh);
get("autoCalibrate").onclick = () => run(async () => {
  const response = await fetch("auto-calibrate", {method: "POST"});
  const data = await response.json();
  if (!response.ok) throw Error(data.error);
  await Promise.all(sides.map(side => new Promise((resolve, reject) => {
    const image = get(side);
    image.onload = resolve;
    image.onerror = () => reject(Error("Kunne ikke vise kalibreringsbilledet."));
    image.src = "data:image/jpeg;base64," + data.images[side];
  })));
  setLabels(data.points.left.length === detailedLabels.length ? detailedLabels : standardLabels);
  points = data.points;
  await previewCalibration(true);
  const warnings = Object.values(data.warnings ?? {});
  if (warnings.length) get("status").textContent += " " + warnings.join(" ");
});
get("calibrate").onclick = () => run(async () => {
  points = points ? null : Object.fromEntries(sides.map(side => [side, []]));
  editing = null;
  hideOverlay();
  get("status").textContent = "";
  if (points) {
    setLabels(detailedLabels);
    await refresh();
    prompt();
  }
});
for (const side of sides) get(side).onclick = event => {
  if (!points || busy || (editing ? editing.done.has(side) : points[side].length === labels.length)) return;
  if (!editing && points[side].length > stepIndex()) return;
  const img = event.currentTarget;
  if (!img.naturalWidth) return;
  const rect = img.getBoundingClientRect();
  const x = (event.clientX - rect.left) * img.naturalWidth / rect.width;
  const y = (event.clientY - rect.top) * img.naturalHeight / rect.height;
  openZoom(side, x, y, editing?.index ?? points[side].length);
};
function openZoom(side, x, y, index) {
  const img = get(side);
  const size = Math.min(cropSize, img.naturalWidth, img.naturalHeight);
  zoom = {
    side, img, size, selected: null,
    x: Math.max(0, Math.min(x - size / 2, img.naturalWidth - size)),
    y: Math.max(0, Math.min(y - size / 2, img.naturalHeight - size))
  };
  get("zoomTitle").textContent = labels[index] + " · " +
    cameraNames[side];
  if (editing) {
    const [oldX, oldY] = points[side][index];
    if (oldX >= zoom.x && oldX < zoom.x + size && oldY >= zoom.y && oldY < zoom.y + size) {
      zoom.selected = [(oldX - zoom.x) / size, (oldY - zoom.y) / size];
    }
  }
  drawCrop();
  get("zoom").showModal();
}
function drawCrop() {
  context.drawImage(zoom.img, zoom.x, zoom.y, zoom.size, zoom.size,
                    0, 0, canvas.width, canvas.height);
  get("confirm").disabled = !zoom.selected;
  if (!zoom.selected) return;
  const [x, y] = zoom.selected;
  if (zoom.ring !== undefined) {
    const scale = canvas.width / zoom.size;
    const dx = zoom.x + x * zoom.size - zoom.anchor[0];
    const dy = zoom.y + y * zoom.size - zoom.anchor[1];
    context.beginPath();
    for (const [index, [px, py]] of previewData[zoom.side][zoom.ring].entries()) {
      const cx = (px + dx - zoom.x) * scale;
      const cy = (py + dy - zoom.y) * scale;
      if (index === 0) context.moveTo(cx, cy);
      else context.lineTo(cx, cy);
    }
    context.lineWidth = 2;
    context.strokeStyle = "#50e6ff";
    context.stroke();
    return;
  }
  context.beginPath();
  const px = x * canvas.width, py = y * canvas.height;
  context.moveTo(px - 8, py - 8);
  context.lineTo(px + 8, py + 8);
  context.moveTo(px + 8, py - 8);
  context.lineTo(px - 8, py + 8);
  context.lineWidth = 3;
  context.strokeStyle = "#ffff00";
  context.stroke();
}
function moveZoomPoint(event) {
  zoom.selected = imagePosition(canvas, event, 1, 1);
  drawCrop();
}
canvas.onpointerdown = event => {
  canvas.setPointerCapture(event.pointerId);
  moveZoomPoint(event);
};
canvas.onpointermove = event => {
  if (canvas.hasPointerCapture(event.pointerId)) moveZoomPoint(event);
};
get("cancelZoom").onclick = () => get("zoom").close();
get("zoom").onclose = () => { zoom = null; };
get("confirm").onclick = () => {
  if (!zoom?.selected) return;
  const {side, x, y, size, selected} = zoom;
  const point = [x + selected[0] * size, y + selected[1] * size];
  if (zoom.ring !== undefined) {
    const {ring, anchor} = zoom;
    get("zoom").close();
    run(() => moveRing(side, ring, point.map((value, axis) => value - anchor[axis])));
    return;
  }
  if (editing) {
    points[side][editing.index] = point;
    editing.done.add(side);
    if (editing.done.size === sides.length) editing = null;
  } else {
    points[side].push(point);
  }
  get("zoom").close();
  if (!editing && completed()) {
    run(previewCalibration);
  } else if (!editing && sides.every(side => points[side].length === stepIndex())) prompt();
  else get("status").textContent = "Vælg og bekræft samme punkt i de resterende billeder.";
};
function hideOverlay() {
  overlayReady = false;
  previewData = null;
  for (const side of sides) {
    const layer = get(side + "Overlay");
    layer.hidden = true;
    layer.classList.remove("editable");
  }
}
function imagePosition(element, event, width, height) {
  const rect = element.getBoundingClientRect();
  return [Math.max(0, Math.min(width, (event.clientX - rect.left) * width / rect.width)),
          Math.max(0, Math.min(height, (event.clientY - rect.top) * height / rect.height))];
}
function paintOverlay(side) {
  const data = previewData;
    const img = get(side);
    const layer = get(side + "Overlay");
    layer.width = img.naturalWidth;
    layer.height = img.naturalHeight;
    const pen = layer.getContext("2d");
    pen.strokeStyle = "#50e6ff";
    pen.lineWidth = 3;
    for (const [index, line] of data[side].entries()) {
      const [dx, dy] = drag?.side === side && drag.ring === index ? drag.delta : [0, 0];
      pen.beginPath();
      pen.moveTo(line[0][0] + dx, line[0][1] + dy);
      for (const [x, y] of line.slice(1)) pen.lineTo(x + dx, y + dy);
      pen.stroke();
    }
    pen.font = "bold " + Math.max(18, Math.round(layer.width / 50)) + "px system-ui";
    pen.textAlign = "center";
    pen.textBaseline = "middle";
    pen.lineWidth = 5;
    pen.strokeStyle = "#101716";
    pen.fillStyle = "#50e6ff";
    for (const [index, [x, y]] of data.labels[side].entries()) {
      pen.strokeText(data.numbers[index], x, y);
      pen.fillText(data.numbers[index], x, y);
    }
    layer.hidden = false;
    layer.classList.add("editable");
}
async function previewCalibration(automatic = false) {
  const response = await fetch("calibration-preview", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(points)
  });
  const data = await response.json();
  if (!response.ok) throw Error(data.error);
  previewData = data;
  for (const side of sides) paintOverlay(side);
  overlayReady = true;
  const worst = side => Math.max(...data.errors[side]).toFixed(1);
  get("status").textContent = "Sammenlign de blå wirer og tal med skiven. Største afvigelse: " +
    sides.map(side => cameraNames[side] + " " + worst(side) + " px").join(", ") + ".";
  if (automatic) get("status").textContent = "Automatisk forslag. Kontrollér de blå wirer og tal, før du gemmer.";
  const combined = labels.map((_, index) => Math.max(...sides.map(side => data.errors[side][index])));
  get("editPoint").selectedIndex = combined.indexOf(Math.max(...combined));
}
async function moveRing(side, ring, [dx, dy]) {
  const original = points[side];
  const detailed = original.length === detailedLabels.length;
  // Legacy fits have anchors only on the inner double and outer treble.
  const start = detailed ? 1 + ring * board.sectors.length : ring === 4 ? 0 : 4;
  const count = detailed ? board.sectors.length : 4;
  const img = get(side);
  const moved = original.map(([x, y], index) =>
    index >= start && index < start + count ? [x + dx, y + dy] : [x, y]);
  if (moved.some(([x, y]) => x < 0 || y < 0 || x >= img.naturalWidth || y >= img.naturalHeight)) {
    throw Error("Ringen skal ligge inden for billedet.");
  }
  points[side] = moved;
  try {
    await previewCalibration();
  } catch (error) {
    points[side] = original;
    paintOverlay(side);
    throw error;
  }
}
function nearestRing(side, [x, y], scaleX, scaleY) {
  const editable = points[side].length === detailedLabels.length ? [0, 1, 2, 3, 4, 5] : [3, 4];
  let best = null;
  for (const ring of editable) {
    for (const [px, py] of previewData[side][ring]) {
      const distance = Math.hypot((x - px) * scaleX, (y - py) * scaleY);
      if (!best || distance < best.distance) best = {ring, px, py, distance};
    }
  }
  return best;
}
for (const side of sides) {
  const layer = get(side + "Overlay");
  const position = event => imagePosition(layer, event, layer.width, layer.height);
  layer.onpointerdown = event => {
    if (busy || drag || !overlayReady || event.button !== 0) return;
    const origin = position(event);
    const rect = layer.getBoundingClientRect();
    const nearest = nearestRing(side, origin, rect.width / layer.width, rect.height / layer.height);
    if (nearest.distance > 10) return;
    drag = {side, ...nearest, pointer: event.pointerId, origin, delta: [0, 0]};
    layer.setPointerCapture(event.pointerId);
  };
  layer.onpointermove = event => {
    if (drag?.side !== side || drag.pointer !== event.pointerId) return;
    drag.delta = position(event).map((value, axis) => value - drag.origin[axis]);
    paintOverlay(side);
  };
  layer.onpointerup = event => {
    if (drag?.side !== side || drag.pointer !== event.pointerId) return;
    const {ring, px, py, origin} = drag;
    const delta = position(event).map((value, axis) => value - origin[axis]);
    drag = null;
    paintOverlay(side);
    const rect = layer.getBoundingClientRect();
    if (Math.hypot(delta[0] * rect.width / layer.width, delta[1] * rect.height / layer.height) < 4) {
      openZoom(side, px, py, 0);
      zoom.ring = ring;
      zoom.anchor = [px, py];
      zoom.selected = [(px - zoom.x) / zoom.size, (py - zoom.y) / zoom.size];
      get("zoomTitle").textContent = ringNames[ring] + " · " + cameraNames[side];
      drawCrop();
    } else {
      run(() => moveRing(side, ring, delta));
    }
  };
  layer.onlostpointercapture = () => {
    if (drag?.side === side) {
      drag = null;
      paintOverlay(side);
    }
  };
}
get("redoPoint").onclick = () => {
  hideOverlay();
  editing = {index: Number(get("editPoint").value), done: new Set()};
  prompt();
  controls();
};
get("saveCalibration").onclick = () => run(async () => {
  await action("calibrate", points);
  points = null;
  hideOverlay();
});
drawBoard([]);
run(refresh).then(poll);
</script>
</html>
